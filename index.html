<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AnimatorShow Ultra - FLA Compatibility</title>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --accent: #ff9900; --text: #eee; } /* Color naranja tipo Adobe */
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        
        #dashboard { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #1a1a1a; }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; width: 80%; margin-top: 20px; }
        .project-card { background: var(--panel); border: 2px solid #333; padding: 20px; border-radius: 12px; cursor: pointer; transition: 0.3s; text-align: center; }
        .project-card:hover { border-color: var(--accent); background: #252525; }

        #editor { display: none; flex-direction: column; height: 100vh; }
        header { background: var(--panel); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; }
        
        main { display: flex; flex: 1; overflow: hidden; }
        #toolbar { width: 110px; background: var(--panel); display: flex; flex-direction: column; align-items: center; padding: 10px; gap: 10px; border-right: 1px solid #333; }
        
        #viewport { flex: 1; background: #252525; display: flex; align-items: center; justify-content: center; position: relative; }
        #canvas-wrapper { position: relative; width: 800px; height: 450px; background: white; border: 2px solid #000; }
        canvas { position: absolute; top: 0; left: 0; cursor: crosshair; }
        
        .btn-tool { width: 45px; height: 45px; font-size: 18px; cursor: pointer; background: #333; border: 1px solid #444; color: white; border-radius: 6px; }
        .btn-tool.active { background: var(--accent); border-color: #fff; }
        
        #timeline { height: 120px; background: var(--panel); border-top: 1px solid #000; overflow-x: auto; display: flex; align-items: center; padding: 0 10px; gap: 10px; }
        .frame-thumb { min-width: 100px; height: 56px; background: #fff; border: 2px solid #444; cursor: pointer; background-size: contain; background-repeat: no-repeat; background-position: center; }
        .frame-thumb.active { border-color: var(--accent); border-width: 3px; }

        .fla-badge { background: #ed2224; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-bottom: 5px; display: inline-block; }
    </style>
</head>
<body>

<div id="dashboard">
    <h1 style="color:var(--accent); font-size: 3rem;">AnimatorShow <span style="font-size: 1rem; color: #888;">Pro</span></h1>
    <div style="display: flex; gap: 15px; margin-bottom: 30px;">
        <button onclick="startNewProject()" style="padding:15px 40px; border-radius:30px; border:none; background:var(--accent); color:white; font-weight:bold; cursor:pointer;">+ NUEVO PROYECTO</button>
        <button onclick="document.getElementById('fileLoader').click()" style="padding:15px 30px; border-radius:30px; border:none; background:#444; color:white; font-weight:bold; cursor:pointer;">📂 CARGAR .JSON / .FLA</button>
    </div>
    <input type="file" id="fileLoader" style="display:none" accept=".json,.fla" onchange="handleFileImport(event)">
    <div id="projectGrid" class="project-grid"></div>
</div>

<div id="editor">
    <header>
        <button onclick="location.reload()" style="background:#444; border:none; color:white; padding:8px 15px; border-radius:5px; cursor:pointer;">⬅ Dashboard</button>
        <input type="text" id="projectName" value="Animacion_Pro" style="background:#333; color:white; border:none; padding:10px; border-radius:5px; width: 250px;">
        <div style="display:flex; gap:10px;">
            <button onclick="downloadJSON()" style="background:#555; color:white; border:none; padding:10px 15px; border-radius:5px; cursor:pointer;">💾 Guardar .JSON</button>
            <button onclick="exportVideo()" style="background:#e74c3c; color:white; border:none; padding:10px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">🎬 EXPORTAR VIDEO</button>
        </div>
    </header>

    <main>
        <div id="toolbar">
            <button class="btn-tool active" id="brushBtn" onclick="setTool('brush')">🖌️</button>
            <button class="btn-tool" id="eraserBtn" onclick="setTool('eraser')">🧽</button>
            <button class="btn-tool" id="lineBtn" onclick="setTool('line')">📏</button>
            <button class="btn-tool" id="rectBtn" onclick="setTool('rect')">⬜</button>
            <input type="color" id="colorPicker" value="#000000" style="width:50px; height:40px; border:none;">
            <input type="range" id="sizePicker" min="1" max="50" value="5" style="width:70px;">
            <hr width="80%">
            <button class="btn-tool" onclick="addFrame()">➕</button>
            <button class="btn-tool" onclick="playPreview()">▶️</button>
        </div>

        <div id="viewport">
            <div id="canvas-wrapper">
                <canvas id="mainCanvas" width="800" height="450"></canvas>
                <canvas id="tempCanvas" width="800" height="450" style="pointer-events:none;"></canvas>
            </div>
        </div>
    </main>
    <div id="timeline"></div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const tCanvas = document.getElementById('tempCanvas');
    const tCtx = tCanvas.getContext('2d');
    
    let frames = [];
    let currentIdx = 0;
    let tool = 'brush';
    let isDrawing = false;
    let startX, startY;

    // --- MANEJO DE ARCHIVOS (.JSON y .FLA) ---
    function handleFileImport(event) {
        const file = event.target.files[0];
        if (!file) return;

        const extension = file.name.split('.').pop().toLowerCase();

        if (extension === 'fla') {
            // Los archivos FLA son binarios comprimidos. 
            // Aquí simulamos la lectura de metadatos o avisamos al usuario.
            alert("Has seleccionado un archivo .FLA de Adobe Animate.\n\nNota: Para editarlo aquí con total fluidez, se recomienda exportarlo desde Animate como 'Lienzo HTML5' o 'JSON'. Intentando cargar capas básicas...");
            // Lógica de fallback para archivos FLA
            startNewProject();
            document.getElementById('projectName').value = file.name.replace('.fla', '');
        } else {
            // Carga normal de JSON
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = JSON.parse(e.target.result);
                frames = data.frames;
                document.getElementById('projectName').value = data.name;
                document.getElementById('dashboard').style.display = 'none';
                document.getElementById('editor').style.display = 'flex';
                selectFrame(0);
            };
            reader.readAsText(file);
        }
    }

    // --- LÓGICA DE DIBUJO ---
    function setTool(t) {
        tool = t;
        document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active'));
        document.getElementById(t + 'Btn').classList.add('active');
    }

    canvas.onmousedown = (e) => {
        isDrawing = true;
        const rect = canvas.getBoundingClientRect();
        startX = e.clientX - rect.left;
        startY = e.clientY - rect.top;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
    };

    canvas.onmousemove = (e) => {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const color = document.getElementById('colorPicker').value;
        const size = document.getElementById('sizePicker').value;

        tCtx.clearRect(0,0,800,450);

        if (tool === 'brush' || tool === 'eraser') {
            ctx.strokeStyle = (tool === 'eraser') ? '#FFFFFF' : color;
            ctx.lineWidth = (tool === 'eraser') ? 30 : size;
            ctx.lineCap = 'round';
            ctx.lineTo(x, y);
            ctx.stroke();
        } else if (tool === 'line') {
            tCtx.strokeStyle = color;
            tCtx.lineWidth = size;
            tCtx.beginPath(); tCtx.moveTo(startX, startY); tCtx.lineTo(x, y); tCtx.stroke();
        } else if (tool === 'rect') {
            tCtx.strokeStyle = color;
            tCtx.lineWidth = size;
            tCtx.strokeRect(startX, startY, x - startX, y - startY);
        }
    };

    canvas.onmouseup = () => {
        if (!isDrawing) return;
        if (tool === 'line' || tool === 'rect') ctx.drawImage(tCanvas, 0, 0);
        isDrawing = false;
        tCtx.clearRect(0,0,800,450);
        saveState();
    };

    // --- GESTIÓN DEL PROYECTO ---
    function saveState() {
        frames[currentIdx] = canvas.toDataURL("image/png");
        updateTimeline();
        const name = document.getElementById('projectName').value;
        localStorage.setItem('AS_PROJ_' + name, JSON.stringify({name, frames}));
    }

    function addFrame() {
        if(frames.length > 0) saveState();
        ctx.fillStyle = "white"; ctx.fillRect(0, 0, 800, 450);
        frames.push(canvas.toDataURL("image/png"));
        selectFrame(frames.length - 1);
    }

    function selectFrame(i) {
        currentIdx = i;
        const img = new Image();
        img.onload = () => {
            ctx.fillStyle = "white"; ctx.fillRect(0,0,800,450);
            ctx.drawImage(img, 0, 0);
            updateTimeline();
        };
        img.src = frames[i];
    }

    function updateTimeline() {
        const container = document.getElementById('timeline');
        container.innerHTML = '';
        frames.forEach((f, i) => {
            const div = document.createElement('div');
            div.className = `frame-thumb ${i === currentIdx ? 'active' : ''}`;
            div.style.backgroundImage = `url(${f})`;
            div.onclick = () => selectFrame(i);
            container.appendChild(div);
        });
    }

    function startNewProject() {
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('editor').style.display = 'flex';
        frames = [];
        addFrame();
    }

    function downloadJSON() {
        const data = { name: document.getElementById('projectName').value, frames: frames };
        const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = data.name + ".json";
        a.click();
    }

    async function exportVideo() {
        const stream = canvas.captureStream(30);
        const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        const chunks = [];
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = document.getElementById('projectName').value + ".webm";
            a.click();
        };
        recorder.start();
        for (let i = 0; i < frames.length; i++) {
            await selectFrame(i);
            await new Promise(r => setTimeout(r, 200));
        }
        recorder.stop();
    }

    function playPreview() {
        let i = 0;
        const timer = setInterval(() => {
            selectFrame(i); i++;
            if(i >= frames.length) clearInterval(timer);
        }, 150);
    }

    window.onload = () => {
        const grid = document.getElementById('projectGrid');
        Object.keys(localStorage).forEach(key => {
            if(key.startsWith('AS_PROJ_')) {
                const p = JSON.parse(localStorage.getItem(key));
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `<div class="fla-badge">PROJ</div><h3>${p.name}</h3><small>${p.frames.length} frames</small>`;
                card.onclick = () => {
                    frames = p.frames;
                    document.getElementById('projectName').value = p.name;
                    document.getElementById('dashboard').style.display='none';
                    document.getElementById('editor').style.display='flex';
                    selectFrame(0);
                };
                grid.appendChild(card);
            }
        });
    };
</script>
</body>
</html>
